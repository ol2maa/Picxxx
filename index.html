<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧩 Math Puzzle - لعبة الرياضيات</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: white;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }
  
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  
  /* ============ شاشة البداية ============ */
  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    text-align: center;
    width: 100%;
  }
  
  #start-screen .title {
    font-size: 42px;
    font-weight: 800;
    color: #ffd700;
    text-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
    margin-bottom: 10px;
  }
  
  #start-screen .subtitle {
    font-size: 20px;
    color: #ccc;
    margin-bottom: 30px;
  }
  
  .btn {
    font-size: 22px;
    font-weight: 700;
    padding: 18px 40px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 280px;
    font-family: inherit;
  }
  
  .btn-primary {
    background: #0f3460;
    color: white;
    border: 3px solid #ffd700;
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
  }
  
  .btn-primary:active {
    transform: scale(0.96);
    box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
  }
  
  .btn-secondary {
    background: #16213e;
    color: white;
    border: 2px solid #2d4059;
    font-size: 18px;
    padding: 14px 30px;
    min-width: 280px;
  }
  
  .btn-secondary:active {
    transform: scale(0.96);
  }
  
  /* ============ شاشة اللعبة ============ */
  #game-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
  }
  
  #image-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #bg-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  
  #tiles-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .tile {
    position: absolute;
    background: #2d4059;
    border: 2px solid #ffd700;
    border-radius: 8px;
    color: white;
    font-size: 30px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    box-sizing: border-box;
  }
  
  .tile:active:not(.revealed) {
    transform: scale(0.95);
    background: #3d5070;
  }
  
  .tile.revealed {
    background: transparent;
    border: none;
    color: transparent;
    pointer-events: none;
  }
  
  /* ============ النافذة المنبثقة للسؤال ============ */
  #question-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  #question-box {
    background: #16213e;
    border: 3px solid #ffd700;
    border-radius: 20px;
    padding: 30px 25px;
    width: 100%;
    max-width: 340px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
  }
  
  #question-text {
    font-size: 32px;
    font-weight: 800;
    color: white;
    text-align: center;
    margin-bottom: 20px;
  }
  
  #answer-input {
    width: 100%;
    font-size: 24px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    text-align: center;
    background: white;
    color: #333;
    font-family: inherit;
    outline: none;
  }
  
  #error-msg {
    color: #ff4444;
    text-align: center;
    min-height: 22px;
    margin-top: 10px;
    font-size: 15px;
  }
  
  #submit-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    background: #0f3460;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  
  #submit-btn:active {
    transform: scale(0.97);
  }
  
  #close-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    background: transparent;
    border: none;
    color: #ff6666;
    font-size: 26px;
    font-weight: 800;
    cursor: pointer;
    width: 36px;
    height: 36px;
    padding: 0;
  }
  
  /* ============ شاشة الفوز ============ */
  #win-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    z-index: 2000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
  }
  
  #win-text {
    font-size: 32px;
    font-weight: 800;
    color: #ffd700;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 20px;
    text-shadow: 0 4px 20px rgba(255, 215, 0, 0.5);
  }
  
  /* ============ شاشة التحميل ============ */
  #loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(26, 26, 46, 0.95);
    z-index: 3000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  
  .spinner {
    width: 60px;
    height: 60px;
    border: 5px solid #2d4059;
    border-top: 5px solid #ffd700;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  #loading-overlay p {
    color: #ffd700;
    font-size: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="app">
  <!-- شاشة البداية -->
  <div id="start-screen">
    <div class="title">🧩 Math Puzzle</div>
    <div class="subtitle">اختر صورة لبدء اللعبة</div>
    
    <button class="btn btn-primary" id="pick-image-btn">
      📷 اختر صورة
    </button>
    
    <button class="btn btn-secondary" id="test-image-btn">
      🎨 استخدم صورة تجريبية
    </button>
    
    <input type="file" id="file-input" accept="image/*" style="display: none;">
  </div>
  
  <!-- شاشة اللعبة -->
  <div id="game-screen">
    <div id="image-container">
      <img id="bg-image" alt="puzzle">
      <div id="tiles-layer"></div>
    </div>
  </div>
</div>

<!-- نافذة السؤال -->
<div id="question-overlay">
  <div id="question-box">
    <button id="close-btn">✕</button>
    <div id="question-text">2 + 3 = ?</div>
    <input type="number" id="answer-input" placeholder="Answer" inputmode="numeric" autocomplete="off">
    <div id="error-msg"></div>
    <button id="submit-btn">OK</button>
  </div>
</div>

<!-- شاشة الفوز -->
<div id="win-overlay">
  <div id="win-text">🎉 Congratulations!<br>You revealed the whole image</div>
  <button class="btn btn-primary" id="replay-btn">🔄 العب مرة أخرى</button>
  <button class="btn btn-secondary" id="new-image-btn">🖼️ صورة جديدة</button>
</div>

<!-- شاشة التحميل -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p>جاري تجهيز اللعبة...</p>
</div>

<script>
// ============ الإعدادات ============
const GRID_COLS = 4;
const GRID_ROWS = 4;
const MAX_SIZE = 1000;

// ============ المتغيرات العامة ============
let currentImage = null;   // الصورة الحالية (HTMLImageElement)
let tiles = [];            // حالة المربعات
let currentTile = null;    // المربع المفتوح حالياً
let currentAnswer = 0;     // الجواب الصحيح للسؤال الحالي
let imageRect = { x: 0, y: 0, w: 0, h: 0 };

// ============ العناصر ============
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const bgImage = document.getElementById('bg-image');
const tilesLayer = document.getElementById('tiles-layer');
const imageContainer = document.getElementById('image-container');
const questionOverlay = document.getElementById('question-overlay');
const questionText = document.getElementById('question-text');
const answerInput = document.getElementById('answer-input');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');
const closeBtn = document.getElementById('close-btn');
const winOverlay = document.getElementById('win-overlay');
const loadingOverlay = document.getElementById('loading-overlay');
const fileInput = document.getElementById('file-input');

// ============ أحداث الأزرار ============
document.getElementById('pick-image-btn').addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  showLoading(true);
  try {
    const img = await loadImageFromFile(file);
    startGame(img);
  } catch (err) {
    alert('خطأ في تحميل الصورة: ' + err.message);
    showLoading(false);
  }
  fileInput.value = ''; // للسماح باختيار نفس الصورة مرة أخرى
});

document.getElementById('test-image-btn').addEventListener('click', () => {
  showLoading(true);
  const img = generateTestImage();
  startGame(img);
});

document.getElementById('replay-btn').addEventListener('click', () => {
  winOverlay.style.display = 'none';
  startGame(currentImage);
});

document.getElementById('new-image-btn').addEventListener('click', () => {
  winOverlay.style.display = 'none';
  backToStart();
});

submitBtn.addEventListener('click', checkAnswer);
closeBtn.addEventListener('click', closeQuestion);

answerInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkAnswer();
});

// ============ تحميل الصور ============
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('فشل تحميل الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('فشل قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

function generateTestImage() {
  const size = 800;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  // خلفية
  ctx.fillStyle = '#1e283c';
  ctx.fillRect(0, 0, size, size);
  
  // مربعات ملونة
  for (let i = 0; i < size; i += 100) {
    for (let j = 0; j < size; j += 100) {
      ctx.fillStyle = `rgb(${(i * 3) % 256}, ${(j * 3) % 256}, ${((i + j) * 2) % 256})`;
      ctx.fillRect(i, j, 100, 100);
    }
  }
  
  // دائرة ذهبية
  ctx.beginPath();
  ctx.arc(400, 400, 150, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();
  
  // نص
  ctx.fillStyle = 'white';
  ctx.font = 'bold 40px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('TEST IMAGE', 400, 400);
  
  // تحويل Canvas إلى Image
  const img = new Image();
  img.src = canvas.toDataURL('image/png');
  return img;
}

// ============ تجهيز الصورة ============
function prepareImage(img) {
  // تصغير إذا كانت ضخمة
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  
  if (Math.max(w, h) > MAX_SIZE) {
    const ratio = MAX_SIZE / Math.max(w, h);
    w = Math.round(w * ratio);
    h = Math.round(h * ratio);
    
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    
    const newImg = new Image();
    newImg.src = canvas.toDataURL('image/png');
    return new Promise(resolve => {
      newImg.onload = () => resolve(newImg);
    });
  }
  
  return Promise.resolve(img);
}

// ============ بدء اللعبة ============
async function startGame(img) {
  showLoading(true);
  
  try {
    currentImage = await prepareImage(img);
    bgImage.src = currentImage.src;
    
    // انتظر تحميل الصورة في DOM
    await new Promise(resolve => {
      if (bgImage.complete) resolve();
      else bgImage.onload = resolve;
    });
    
    startScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    winOverlay.style.display = 'none';
    
    // انتظر slight delay لحساب الأبعاد
    setTimeout(() => {
      computeImageRect();
      createTiles();
      showLoading(false);
    }, 100);
    
  } catch (err) {
    alert('خطأ: ' + err.message);
    showLoading(false);
  }
}

function backToStart() {
  gameScreen.style.display = 'none';
  startScreen.style.display = 'flex';
  tilesLayer.innerHTML = '';
  tiles = [];
  currentImage = null;
  bgImage.src = '';
}

// ============ حساب مكان الصورة ============
function computeImageRect() {
  const rect = bgImage.getBoundingClientRect();
  const containerRect = imageContainer.getBoundingClientRect();
  
  imageRect = {
    x: rect.left - containerRect.left,
    y: rect.top - containerRect.top,
    w: rect.width,
    h: rect.height
  };
  
  // اجعل الـ container بنفس حجم الصورة
  imageContainer.style.width = rect.width + 'px';
  imageContainer.style.height = rect.height + 'px';
  tilesLayer.style.width = rect.width + 'px';
  tilesLayer.style.height = rect.height + 'px';
}

// ============ إنشاء المربعات ============
function createTiles() {
  tilesLayer.innerHTML = '';
  tiles = [];
  
  const tileW = imageRect.w / GRID_COLS;
  const tileH = imageRect.h / GRID_ROWS;
  
  for (let r = 0; r < GRID_ROWS; r++) {
    const row = [];
    for (let c = 0; c < GRID_COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = '?';
      tile.style.left = (c * tileW) + 'px';
      tile.style.top = (r * tileH) + 'px';
      tile.style.width = tileW + 'px';
      tile.style.height = tileH + 'px';
      
      const data = { r, c, revealed: false, element: tile };
      tile.addEventListener('click', () => tileTapped(data));
      
      tilesLayer.appendChild(tile);
      row.push(data);
    }
    tiles.push(row);
  }
}

// ============ النقر على مربع ============
function tileTapped(tileData) {
  if (tileData.revealed) return;
  
  currentTile = tileData;
  const { question, answer } = generateQuestion();
  currentAnswer = answer;
  
  questionText.textContent = question;
  answerInput.value = '';
  errorMsg.textContent = '';
  questionOverlay.style.display = 'flex';
  
  setTimeout(() => answerInput.focus(), 200);
}

function generateQuestion() {
  const ops = ['+', '-', '×'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, answer;
  
  if (op === '+') {
    a = randInt(1, 50);
    b = randInt(1, 50);
    answer = a + b;
  } else if (op === '-') {
    a = randInt(10, 50);
    b = randInt(1, a);
    answer = a - b;
  } else {
    a = randInt(2, 12);
    b = randInt(2, 12);
    answer = a * b;
  }
  
  return { question: `${a} ${op} ${b} = ?`, answer };
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ============ فحص الجواب ============
function checkAnswer() {
  const val = answerInput.value.trim();
  
  if (!val) {
    errorMsg.textContent = 'Please enter an answer';
    return;
  }
  
  const userAnswer = parseInt(val, 10);
  
  if (isNaN(userAnswer)) {
    errorMsg.textContent = 'Enter a valid number';
    return;
  }
  
  if (userAnswer === currentAnswer) {
    currentTile.revealed = true;
    currentTile.element.classList.add('revealed');
    closeQuestion();
    
    if (checkWin()) {
      setTimeout(showWin, 400);
    }
  } else {
    errorMsg.textContent = 'Wrong answer, try again';
    answerInput.value = '';
    answerInput.focus();
  }
}

function closeQuestion() {
  questionOverlay.style.display = 'none';
  currentTile = null;
}

// ============ الفوز ============
function checkWin() {
  for (const row of tiles) {
    for (const t of row) {
      if (!t.revealed) return false;
    }
  }
  return true;
}

function showWin() {
  winOverlay.style.display = 'flex';
}

// ============ التحميل ============
function showLoading(show) {
  loadingOverlay.style.display = show ? 'flex' : 'none';
}

// ============ إعادة الحساب عند تغيير حجم الشاشة ============
let resizeTimeout;
window.addEventListener('resize', () => {
  if (gameScreen.style.display === 'none') return;
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    computeImageRect();
    // إعادة رسم المربعات
    if (tiles.length > 0) {
      const tileW = imageRect.w / GRID_COLS;
      const tileH = imageRect.h / GRID_ROWS;
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const t = tiles[r][c];
          t.element.style.left = (c * tileW) + 'px';
          t.element.style.top = (r * tileH) + 'px';
          t.element.style.width = tileW + 'px';
          t.element.style.height = tileH + 'px';
        }
      }
    }
  }, 200);
});

// منع الزوم على iOS
document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
